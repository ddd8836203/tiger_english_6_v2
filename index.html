<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>英語特訓｜課本精讀・聽力口說・即時對答・錯題本・A4 出卷</title>
  <meta name="description" content="英語特訓網站：課文聽讀跟讀、7大錨點單字、點詞抓錯、雙軌測驗、晨間體操、終身錯題本與 A4 考卷排版列印。">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英語特訓">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=20261025_4">

  <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script defer src="english_data.js"></script>
  <script defer src="midterm_data.js"></script>
  <script defer src="app.js?v=20261025_4"></script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar no-print">
    <button class="brand" id="nav-home" type="button" aria-label="回首頁">
      <span class="brand-mark">🔤</span>
      <span class="brand-text">
        <h1>英語特訓</h1>
        <small>課本 × 岱崙 3C 歷史考券</small>
      </span>
    </button>
    <nav class="nav" aria-label="主選單">
      <button class="nav-btn user-switch-btn" id="nav-user" type="button" title="切換使用人員 / 帳號管理">
        <span id="nav-user-icon">🦖</span>
        <span id="nav-user-name">Rex</span>
        <span class="user-caret">▾</span>
      </button>
      <button class="nav-btn" id="nav-tts-speed" type="button" title="切換 TTS 朗讀語速">
        <span>🔊 <strong id="nav-tts-label">1.0x</strong></span>
      </button>
      <button class="nav-btn" id="nav-errors" type="button">
        🔥 <span class="nav-label">錯題本</span> <b class="pill" id="nav-error-count">0</b>
      </button>
      <button class="nav-btn" id="nav-print" type="button">
        🖨️ <span class="nav-label">A4 出卷</span>
      </button>
      <button class="nav-btn primary" id="nav-export" type="button">
        📤 <span class="nav-label">匯出給 AI</span>
      </button>
    </nav>
  </header>

  <main id="app" class="app">
    <p class="loading">英語特訓系統載入中…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 課文點選單字 7 大錨點解析小卡 Modal -->
  <div id="vocabPopoverModal" class="modal-overlay no-print" style="display:none;">
    <div class="modal-card vocab-popover-card" id="vocabPopoverContent"></div>
  </div>

  <!-- AI Prompt Modal -->
  <div id="aiPromptModal" class="modal-overlay no-print" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🤖 一鍵複製 AI 教研閉環出題 Prompt</h3>
        <button id="closeModalBtn" class="btn-close">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-tip">已自動匯整學生的弱點單元、錯題代碼與盲點原因，複製後直接貼給 AI 即可生成 3 題同觀念深度變式題！</p>
        <textarea id="aiPromptTextarea" class="prompt-textarea" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button id="copyPromptBtn" class="btn-cta">
          <span>📋 一鍵複製 Prompt</span>
        </button>
      </div>
    </div>
  </div>

  <noscript><p class="loading">這個網站需要開啟 JavaScript。</p></noscript>
</body>
</html>
